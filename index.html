<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel File Parser</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        input[type="file"] {
            display: block;
            margin: 20px 0;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        #error {
            color: red;
            margin-top: 10px;
        }
        #download-link {
            max-width: 800px;
            margin: 0 auto;
        }
        #download-link a {
            display: none;
            margin: 10px 0;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
        #download-link a:hover {
            background-color: #45a049;
        }
        #files {
            display: flex;
            gap: 1em;
            max-width: 800px;
            margin: 0 auto;
        }

        #files div {
            width: 50%;
        }

        #output {
            max-width: 100%;
            overflow: scroll;
        }
    </style>
</head>
<body>
    <h1>KIR/KPR konverzija</h1>
    <div id="metadata" style="max-width: 400px; margin: 20px auto; font-family: Arial, sans-serif;">
        <div style="margin-bottom: 15px;">
            <label for="davcnaStevilka">Davčna številka zavezanca:*</label><br>
            <input type="text" id="davcnaStevilka" name="davcnaStevilka" style="width: 100%; padding: 8px;" required>
        </div>
        <div style="margin-bottom: 15px;">
            <label for="obdobjeOd">Obdobje od:*</label><br>
            <input type="date" id="obdobjeOd" name="obdobjeOd" style="width: 100%; padding: 8px;" required>
        </div>
        <div style="margin-bottom: 15px;">
            <label for="obdobjeDo">Obdobje do:*</label><br>
            <input type="date" id="obdobjeDo" name="obdobjeDo" style="width: 100%; padding: 8px;" required>
        </div>
        <script>
            // Set default dates for Obdobje od (first day of previous month) and Obdobje do (last day of previous month)
            document.addEventListener('DOMContentLoaded', () => {
                const today = new Date();
                const prevMonthFirstDay = new Date(today.getFullYear(), today.getMonth() - 1, 1);
                const prevMonthLastDay = new Date(today.getFullYear(), today.getMonth(), 0);
                document.getElementById('obdobjeOd').value = prevMonthFirstDay.toISOString().split('T')[0];
                document.getElementById('obdobjeDo').value = prevMonthLastDay.toISOString().split('T')[0];
            });
        </script>
        <div style="margin-bottom: 15px;">
            <label>
                <input type="checkbox" id="zahtevamVracilo" name="zahtevamVracilo">
                Zahtevam vračilo
            </label>
        </div>
        <div style="margin-bottom: 15px;">
            <label>
                <input type="checkbox" id="izracunavamOdbitniDelez" name="izracunavamOdbitniDelez">
                Izračunavam odbitni delež
            </label>
        </div>
        <div style="margin-bottom: 15px;">
            <label for="nacin">Način:</label><br>
            <select id="nacin" name="nacin" style="width: 100%; padding: 8px;">
                <option value="">-- Izberite možnost --</option>
                <option value="1">1 - Samoprijava</option>
                <option value="2">2 - Vloga za predložitev po roku</option>
                <option value="3">3 - Ne bom uporabil instituta samoprijave</option>
            </select>
        </div>
        <div style="margin-bottom: 15px;">
            <label for="opomba">Opomba:</label><br>
            <input type="text" id="opomba" name="opomba" style="width: 100%; padding: 8px;">
        </div>
    </div>
    <div id="files">
        <div>
            <h2>Knjiga prejetih računov</h2>
            <input type="file" id="kprFile" accept=".xls,.xlsx">
        </div>
        <div>
            <h2>Knjiga izdanih računov</h2>
            <input type="file" id="kirFile" accept=".xls,.xlsx">
        </div>
    </div>
    <div id="download-link">
        <a id="downloadJson" href="#" download="KIR_KPR.json">Prenesi JSON za FURS</a>
        <a id="downloadZip" href="#" download="KIR_KPR.zip">Prenesi ZIP za FURS</a>
    </div>
    <div id="error"></div>
    <div id="output"></div>
    <div style="text-align: center; margin-top: 20px; font-size: 0.8em; color: #666;">
        Version: <span id="appVersion"></span>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
